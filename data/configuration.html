<!-- Configuration page - styles for the generated inputs -->
<link rel="stylesheet" href="configuration.css" />

<div class="shaderOverlay">
    <div style="padding: 25px;">
        <h2>Configuration</h2>
        <p>
            Be aware that wifi connectivity can sometimes be a little unreliable!
            For some settings, changes won't be automatically applied until 💾 is pressed.
        </p>
        <div class="config-toolbar">
            <span id="configGlobalStatus" class="config-global-status"></span>
            <button type="button" id="configRefreshButton" class="btn config-refresh btn--autowidth">🔄 Refresh All</button>
        </div>

        <table id="configTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody id="configTableBody">
                <tr>
                    <td colspan="3" class="config-placeholder">⏳ Loading configuration…</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
