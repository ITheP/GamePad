<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Effects - Bounce & Gravity</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background: #16213e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            border: 2px solid #0f3460;
            border-radius: 8px;
            background: #000;
            image-rendering: pixelated;
            width: 480px;
            height: 360px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            color: #e0e0e0;
        }

        .controls label {
            font-size: 16px;
            font-weight: 500;
        }

        .controls select {
            padding: 8px 15px;
            border-radius: 6px;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }

        .controls select:hover {
            border-color: #e94560;
        }

        .controls select:focus {
            border-color: #e94560;
        }

        .info {
            color: #888;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
        }

        .particle-count {
            color: #e94560;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <canvas id="canvas" width="128" height="64"></canvas>
        <div class="controls">
            <label for="effectSelect">Effect:</label>
            <select id="effectSelect">
                <option value="Bounce">Bounce</option>
                <option value="Gravity">Gravity</option>
                <option value="GlobalSwoosh">Global Swoosh</option>
                <option value="SprinkleSwoosh">Sprinkle Swoosh</option>
                <option value="GlobalSprinkleSwoosh">Global Sprinkle Swoosh</option>
                <option value="Rain">Rain</option>
            </select>
            <span>Particles: <span class="particle-count" id="particleCount">0</span></span>
        </div>
        <div class="info">White pixels act as walls for particles to bounce off</div>
    </div>

    <script>
        // --- Constants ---
        const SCREEN_WIDTH = 128;
        const SCREEN_HEIGHT = 64;
        const IDLE_MAX_PARTICLE_COUNT = 64;
        const MAX_VELOCITY = 0.95;
        const GRAVITY = 0.03;
        const SWOSH_SPEED = 0.02; // Speed of the sine/cosine oscillation
        const RAIN_SPLASH_FACTOR = 0.25; // Velocity reduction on bounce (1/4)

        // --- Canvas Setup ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(SCREEN_WIDTH, SCREEN_HEIGHT);

        // --- Display object ---
        const Display = {
            buffer: new Uint8Array(SCREEN_WIDTH * SCREEN_HEIGHT),

            clear() {
                this.buffer.fill(0);
            },

            getPixel(x, y) {
                if (x < 0 || x >= SCREEN_WIDTH || y < 0 || y >= SCREEN_HEIGHT) {
                    return 0;
                }
                return this.buffer[y * SCREEN_WIDTH + x];
            },

            writePixel(x, y, color) {
                if (x < 0 || x >= SCREEN_WIDTH || y < 0 || y >= SCREEN_HEIGHT) {
                    return;
                }
                this.buffer[y * SCREEN_WIDTH + x] = color;
            },

            // Draw random objects (rectangles and circles)
            drawRandomObjects() {
                // Clear first
                this.clear();

                // Draw random rectangles
                const numRectangles = 8;
                for (let i = 0; i < numRectangles; i++) {
                    const x = Math.floor(Math.random() * (SCREEN_WIDTH - 20));
                    const y = Math.floor(Math.random() * (SCREEN_HEIGHT - 20));
                    const w = 5 + Math.floor(Math.random() * 15);
                    const h = 5 + Math.floor(Math.random() * 15);

                    // Hollow
                    // Draw top and bottom edges
                    for (let dx = 0; dx < w && x + dx < SCREEN_WIDTH; dx++) {
                        if (y >= 0 && y < SCREEN_HEIGHT) {
                            this.writePixel(x + dx, y, 1); // Top edge
                        }
                        if (y + h - 1 >= 0 && y + h - 1 < SCREEN_HEIGHT) {
                            this.writePixel(x + dx, y + h - 1, 1); // Bottom edge
                        }
                    }

                    // Draw left and right edges
                    for (let dy = 0; dy < h && y + dy < SCREEN_HEIGHT; dy++) {
                        if (x >= 0 && x < SCREEN_WIDTH) {
                            this.writePixel(x, y + dy, 1); // Left edge
                        }
                        if (x + w - 1 >= 0 && x + w - 1 < SCREEN_WIDTH) {
                            this.writePixel(x + w - 1, y + dy, 1); // Right edge
                        }
                    }
                }

                // Draw random circles (using pixel approximation)
                const numCircles = 6;
                for (let i = 0; i < numCircles; i++) {
                    const cx = 10 + Math.floor(Math.random() * (SCREEN_WIDTH - 20));
                    const cy = 10 + Math.floor(Math.random() * (SCREEN_HEIGHT - 20));
                    const radius = 5 + Math.floor(Math.random() * 5);

                    // Outline
                    // Draw circle outline using mid-point circle algorithm
                    let x = 0;
                    let y = radius;
                    let d = 3 - 2 * radius;

                    while (y >= x) {
                        // Draw all 8 octants
                        const points = [
                            [cx + x, cy + y], [cx - x, cy + y],
                            [cx + x, cy - y], [cx - x, cy - y],
                            [cx + y, cy + x], [cx - y, cy + x],
                            [cx + y, cy - x], [cx - y, cy - x]
                        ];

                        for (let p of points) {
                            const px = p[0];
                            const py = p[1];
                            if (px >= 0 && px < SCREEN_WIDTH && py >= 0 && py < SCREEN_HEIGHT) {
                                this.writePixel(px, py, 1);
                            }
                        }

                        if (d < 0) {
                            d = d + 4 * x + 6;
                        } else {
                            d = d + 4 * (x - y) + 10;
                            y--;
                        }
                        x++;
                    }
                }
            },

            render() {
                const data = imageData.data;
                for (let i = 0; i < this.buffer.length; i++) {
                    const idx = i * 4;
                    const val = this.buffer[i] ? 255 : 0;
                    data[idx] = val;
                    data[idx + 1] = val;
                    data[idx + 2] = val;
                    data[idx + 3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
            }
        };

        // --- Data Structures ---
        class IdleSpawnPoint {
            constructor(x, y, w, h, maxParticles) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.maxParticles = maxParticles;
            }
        }

        class IdleParticle {
            constructor() {
                this.x = 0;
                this.y = 0;
                this.vx = 0;
                this.vy = 0;
                this.lastX = 0;
                this.lastY = 0;
            }
        }

        // --- Global State ---
        let IdleParticleCount = IDLE_MAX_PARTICLE_COUNT;
        const IdleSpawnPoints = [
            new IdleSpawnPoint(5, 10, 15, 20, IDLE_MAX_PARTICLE_COUNT),
            new IdleSpawnPoint(10, 15, 10, 10, 32),
            new IdleSpawnPoint(30, 20, 20, 15, IDLE_MAX_PARTICLE_COUNT),
            new IdleSpawnPoint(50, 30, 15, 15, IDLE_MAX_PARTICLE_COUNT),
            new IdleSpawnPoint(20, 50, 20, 10, IDLE_MAX_PARTICLE_COUNT)
        ];
        const IdleSpawnPointCount = IdleSpawnPoints.length;

        let particles = [];
        let currentParticleCount = 0;
        let nextSpawnTime = 0;
        const spawnRate = 300;
        let spawnDirection = 1;
        let swoshTimeV = 0; // Time counter for swosh effect
        let swoshTimeH = 0; // Time counter for swosh effect

        let rnd1 = 0;
        let rnd2 = 0;

        // --- Utility Functions ---
        function rand() {
            return Math.random();
        }

        function randVel() {
            const mag = 0.15 + rand() * 0.15;
            return rand() < 0.5 ? mag : -mag;
        }

        function randPosVel() {
            return 0.15 + rand() * 0.15;
        }

        // --- Effect Functions ---
        function RenderIdleEffect_Bounce() {
            for (let i = 0; i < currentParticleCount; i++) {
                const p = particles[i];

                // Erase previous pixel
                Display.writePixel(p.lastX, p.lastY, 0);

                let tryXf = p.x + p.vx;
                let tryYf = p.y + p.vy;

                let xi_try = Math.floor(tryXf);
                let yi_try = Math.floor(tryYf);

                let newVx = p.vx;
                let newVy = p.vy;

                // Horizontal collision
                if (xi_try < 0 || xi_try >= SCREEN_WIDTH ||
                    Display.getPixel(xi_try, p.lastY) === 1) {

                    if (Date.now() > nextSpawnTime) {
                        if (spawnDirection === 1) {
                            if (currentParticleCount < IdleParticleCount) {
                                const newP = particles[currentParticleCount];
                                newP.x = p.x;
                                newP.y = p.y;
                                newP.lastX = p.lastX;
                                newP.lastY = p.lastY;
                                newP.vx = randVel();
                                newP.vy = randVel();
                                nextSpawnTime = Date.now() + spawnRate;
                                currentParticleCount++;
                            } else {
                                spawnDirection = -1;
                            }
                        }

                        if (spawnDirection === -1 && i === currentParticleCount - 1) {
                            currentParticleCount--;
                            if (currentParticleCount === 0) {
                                InitIdleEffect();
                                return;
                            }
                            continue;
                        }
                    }

                    newVx = -newVx;

                    if (tryXf < 1.0) tryXf += 1.0;
                    else if (tryXf >= SCREEN_WIDTH - 1.0) tryXf -= 1.0;

                    tryXf += newVx;
                    xi_try = Math.floor(tryXf);
                }

                // Vertical collision
                if (yi_try < 0 || yi_try >= SCREEN_HEIGHT ||
                    Display.getPixel(p.lastX, yi_try) === 1) {
                    newVy = -newVy;

                    if (tryYf < 1.0) tryYf += 1.0;
                    else if (tryYf >= SCREEN_HEIGHT - 1.0) tryYf -= 1.0;

                    tryYf += newVy;
                    yi_try = Math.floor(tryYf);
                }

                let xi_final = xi_try;
                let yi_final = yi_try;

                // Final position check
                if (Display.getPixel(xi_final, yi_final) === 1) {
                    if (newVx > 0) newVx = -randPosVel();
                    else newVx = randPosVel();
                    if (newVy > 0) newVy = -randPosVel();
                    else newVy = randPosVel();

                    tryXf = p.x;
                    tryYf = p.y;
                    xi_final = p.lastX;
                    yi_final = p.lastY;
                }

                p.vx = newVx;
                p.vy = newVy;
                p.x = tryXf;
                p.y = tryYf;

                Display.writePixel(xi_final, yi_final, 1);
                p.lastX = xi_final;
                p.lastY = yi_final;
            }
        }

        function RenderIdleEffect_Gravity() {
            for (let i = 0; i < currentParticleCount; i++) {
                const p = particles[i];

                // Erase previous pixel
                Display.writePixel(p.lastX, p.lastY, 0);

                // Apply gravity
                p.vy += GRAVITY;

                // Clamp velocities
                if (p.vx > MAX_VELOCITY) p.vx = MAX_VELOCITY;
                if (p.vx < -MAX_VELOCITY) p.vx = -MAX_VELOCITY;
                if (p.vy > MAX_VELOCITY) p.vy = MAX_VELOCITY;
                if (p.vy < -MAX_VELOCITY) p.vy = -MAX_VELOCITY;

                let tryXf = p.x + p.vx;
                let tryYf = p.y + p.vy;

                let xi_try = Math.floor(tryXf);
                let yi_try = Math.floor(tryYf);

                let newVx = p.vx;
                let newVy = p.vy;

                // Horizontal collision
                if (xi_try < 0 || xi_try >= SCREEN_WIDTH ||
                    Display.getPixel(xi_try, p.lastY) === 1) {

                    if (Date.now() > nextSpawnTime) {
                        if (spawnDirection === 1) {
                            if (currentParticleCount < IdleParticleCount) {
                                const newP = particles[currentParticleCount];
                                newP.x = p.x;
                                newP.y = p.y;
                                newP.lastX = p.lastX;
                                newP.lastY = p.lastY;
                                newP.vx = randVel();
                                newP.vy = randVel();
                                nextSpawnTime = Date.now() + spawnRate;
                                currentParticleCount++;
                            } else {
                                spawnDirection = -1;
                            }
                        }

                        if (spawnDirection === -1 && i === currentParticleCount - 1) {
                            currentParticleCount--;
                            if (currentParticleCount === 0) {
                                InitIdleEffect();
                                return;
                            }
                            continue;
                        }
                    }

                    newVx = -newVx;

                    if (tryXf < 1.0) tryXf += 1.0;
                    else if (tryXf >= SCREEN_WIDTH - 1.0) tryXf -= 1.0;

                    tryXf += newVx;
                    xi_try = Math.floor(tryXf);
                }

                // Vertical collision (with bottom wrap)
                if (yi_try < 0 || yi_try >= SCREEN_HEIGHT ||
                    Display.getPixel(p.lastX, yi_try) === 1) {

                    // Wrap at bottom
                    if (yi_try >= SCREEN_HEIGHT) {
                        let newX;
                        let attempts = 0;
                        do {
                            newX = Math.floor(rand() * SCREEN_WIDTH);
                            attempts++;
                        } while (Display.getPixel(newX, 0) === 1 && attempts < 100);

                        p.x = newX;
                        p.y = 0;
                        p.lastX = Math.floor(p.x);
                        p.lastY = 0;
                        p.vy = 0.1 + rand() * 0.2;
                        p.vx = randVel() * 0.5;

                        Display.writePixel(Math.floor(p.x), Math.floor(p.y), 1);
                        continue;
                    } else {
                        // Normal bounce (top or white pixel)
                        newVy = -newVy;

                        if (tryYf < 1.0) tryYf += 1.0;
                        else if (tryYf >= SCREEN_HEIGHT - 1.0) tryYf -= 1.0;

                        tryYf += newVy;
                        yi_try = Math.floor(tryYf);
                    }
                }

                let xi_final = xi_try;
                let yi_final = yi_try;

                // Final position check
                if (Display.getPixel(xi_final, yi_final) === 1) {
                    if (newVx > 0) newVx = -0.1 - rand() * 0.2;
                    else newVx = 0.1 + rand() * 0.2;
                    if (newVy > 0) newVy = -0.1 - rand() * 0.2;
                    else newVy = 0.1 + rand() * 0.2;

                    tryXf = p.x;
                    tryYf = p.y;
                    xi_final = p.lastX;
                    yi_final = p.lastY;
                }

                p.vx = newVx;
                p.vy = newVy;
                p.x = tryXf;
                p.y = tryYf;

                Display.writePixel(xi_final, yi_final, 1);
                p.lastX = xi_final;
                p.lastY = yi_final;
            }
        }

        function RenderIdleEffect_GlobalSwoosh() {
            // Update swosh time
            swoshTimeV += SWOSH_SPEED * rnd1;
            swoshTimeH += SWOSH_SPEED * rnd2;

            // Calculate multipliers (0 to 1 range)
            const sinMultiplier = (Math.sin(swoshTimeV) + 1) * 0.5; // 0 to 1
            const cosMultiplier = (Math.cos(swoshTimeH) + 1) * 0.5; // 0 to 1

            for (let i = 0; i < currentParticleCount; i++) {
                const p = particles[i];

                // Erase previous pixel
                Display.writePixel(p.lastX, p.lastY, 0);

                // Apply swosh multipliers to velocities
                let vx_swosh = p.vx * sinMultiplier;
                let vy_swosh = p.vy * cosMultiplier;

                let tryXf = p.x + vx_swosh;
                let tryYf = p.y + vy_swosh;

                let xi_try = Math.floor(tryXf);
                let yi_try = Math.floor(tryYf);

                let newVx = p.vx;
                let newVy = p.vy;

                // Horizontal collision
                if (xi_try < 0 || xi_try >= SCREEN_WIDTH ||
                    Display.getPixel(xi_try, p.lastY) === 1) {

                    if (Date.now() > nextSpawnTime) {
                        if (spawnDirection === 1) {
                            if (currentParticleCount < IdleParticleCount) {
                                const newP = particles[currentParticleCount];
                                newP.x = p.x;
                                newP.y = p.y;
                                newP.lastX = p.lastX;
                                newP.lastY = p.lastY;
                                newP.vx = randVel();
                                newP.vy = randVel();
                                nextSpawnTime = Date.now() + spawnRate;
                                currentParticleCount++;
                            } else {
                                spawnDirection = -1;
                            }
                        }

                        if (spawnDirection === -1 && i === currentParticleCount - 1) {
                            currentParticleCount--;
                            if (currentParticleCount === 0) {
                                InitIdleEffect();
                                return;
                            }
                            continue;
                        }
                    }

                    newVx = -newVx;

                    if (tryXf < 1.0) tryXf += 1.0;
                    else if (tryXf >= SCREEN_WIDTH - 1.0) tryXf -= 1.0;

                    tryXf += newVx * sinMultiplier;
                    xi_try = Math.floor(tryXf);
                }

                // Vertical collision
                if (yi_try < 0 || yi_try >= SCREEN_HEIGHT ||
                    Display.getPixel(p.lastX, yi_try) === 1) {
                    newVy = -newVy;

                    if (tryYf < 1.0) tryYf += 1.0;
                    else if (tryYf >= SCREEN_HEIGHT - 1.0) tryYf -= 1.0;

                    tryYf += newVy * cosMultiplier;
                    yi_try = Math.floor(tryYf);
                }

                let xi_final = xi_try;
                let yi_final = yi_try;

                // Final position check
                if (Display.getPixel(xi_final, yi_final) === 1) {
                    if (newVx > 0) newVx = -randPosVel();
                    else newVx = randPosVel();
                    if (newVy > 0) newVy = -randPosVel();
                    else newVy = randPosVel();

                    tryXf = p.x;
                    tryYf = p.y;
                    xi_final = p.lastX;
                    yi_final = p.lastY;
                }

                p.vx = newVx;
                p.vy = newVy;
                p.x = tryXf;
                p.y = tryYf;

                Display.writePixel(xi_final, yi_final, 1);
                p.lastX = xi_final;
                p.lastY = yi_final;
            }
        }

        function RenderIdleEffect_SprinkleSwoosh() {
            // Update swosh time
            swoshTimeV += SWOSH_SPEED * rnd1;
            swoshTimeH += SWOSH_SPEED * rnd2;

            for (let i = 0; i < currentParticleCount; i++) {
                // Calculate multipliers (0 to 1 range)
                let sinMultiplier = (Math.sin(swoshTimeV + i) + 1) * 0.5; // 0 to 1
                let cosMultiplier = (Math.cos(swoshTimeH + i) + 1) * 0.5; // 0 to 1

                const p = particles[i];

                // Erase previous pixel
                Display.writePixel(p.lastX, p.lastY, 0);

                // Apply swosh multipliers to velocities
                let vx_swosh = p.vx * sinMultiplier;
                let vy_swosh = p.vy * cosMultiplier;

                let tryXf = p.x + vx_swosh;
                let tryYf = p.y + vy_swosh;

                let xi_try = Math.floor(tryXf);
                let yi_try = Math.floor(tryYf);

                let newVx = p.vx;
                let newVy = p.vy;

                // Horizontal collision
                if (xi_try < 0 || xi_try >= SCREEN_WIDTH ||
                    Display.getPixel(xi_try, p.lastY) === 1) {

                    if (Date.now() > nextSpawnTime) {
                        if (spawnDirection === 1) {
                            if (currentParticleCount < IdleParticleCount) {
                                const newP = particles[currentParticleCount];
                                newP.x = p.x;
                                newP.y = p.y;
                                newP.lastX = p.lastX;
                                newP.lastY = p.lastY;
                                newP.vx = randVel();
                                newP.vy = randVel();
                                nextSpawnTime = Date.now() + spawnRate;
                                currentParticleCount++;
                            } else {
                                spawnDirection = -1;
                            }
                        }

                        if (spawnDirection === -1 && i === currentParticleCount - 1) {
                            currentParticleCount--;
                            if (currentParticleCount === 0) {
                                InitIdleEffect();
                                return;
                            }
                            continue;
                        }
                    }

                    newVx = -newVx;

                    if (tryXf < 1.0) tryXf += 1.0;
                    else if (tryXf >= SCREEN_WIDTH - 1.0) tryXf -= 1.0;

                    tryXf += newVx * sinMultiplier;
                    xi_try = Math.floor(tryXf);
                }

                // Vertical collision
                if (yi_try < 0 || yi_try >= SCREEN_HEIGHT ||
                    Display.getPixel(p.lastX, yi_try) === 1) {
                    newVy = -newVy;

                    if (tryYf < 1.0) tryYf += 1.0;
                    else if (tryYf >= SCREEN_HEIGHT - 1.0) tryYf -= 1.0;

                    tryYf += newVy * cosMultiplier;
                    yi_try = Math.floor(tryYf);
                }

                let xi_final = xi_try;
                let yi_final = yi_try;

                // Final position check
                if (Display.getPixel(xi_final, yi_final) === 1) {
                    if (newVx > 0) newVx = -randPosVel();
                    else newVx = randPosVel();
                    if (newVy > 0) newVy = -randPosVel();
                    else newVy = randPosVel();

                    tryXf = p.x;
                    tryYf = p.y;
                    xi_final = p.lastX;
                    yi_final = p.lastY;
                }

                p.vx = newVx;
                p.vy = newVy;
                p.x = tryXf;
                p.y = tryYf;

                Display.writePixel(xi_final, yi_final, 1);
                p.lastX = xi_final;
                p.lastY = yi_final;
            }
        }

        function RenderIdleEffect_GlobalSprinkleSwoosh() {
            // Update swosh time
            swoshTimeV += SWOSH_SPEED * rnd1;
            swoshTimeH += SWOSH_SPEED * rnd2;

            // Calculate multipliers (0 to 1 range)
            var sinMultiplier = (Math.sin(swoshTimeV) + 1) * 0.5; // 0 to 1
            var cosMultiplier = (Math.cos(swoshTimeH) + 1) * 0.5; // 0 to 1

            for (let i = 0; i < currentParticleCount; i++) {
                // Calculate multipliers (0 to 1 range)
                var sinMultiplier2 = (Math.sin(swoshTimeV + i) + 1) * 0.5; // 0 to 1
                var cosMultiplier2 = (Math.cos(swoshTimeH + i) + 1) * 0.5; // 0 to 1

                const p = particles[i];

                // Erase previous pixel
                Display.writePixel(p.lastX, p.lastY, 0);

                // Apply swosh multipliers to velocities
                let vx_swosh = p.vx * ((sinMultiplier + sinMultiplier2) * 0.5);
                let vy_swosh = p.vy * ((cosMultiplier + cosMultiplier2) * 0.5);

                let tryXf = p.x + vx_swosh;
                let tryYf = p.y + vy_swosh;

                let xi_try = Math.floor(tryXf);
                let yi_try = Math.floor(tryYf);

                let newVx = p.vx;
                let newVy = p.vy;

                // Horizontal collision
                if (xi_try < 0 || xi_try >= SCREEN_WIDTH ||
                    Display.getPixel(xi_try, p.lastY) === 1) {

                    if (Date.now() > nextSpawnTime) {
                        if (spawnDirection === 1) {
                            if (currentParticleCount < IdleParticleCount) {
                                const newP = particles[currentParticleCount];
                                newP.x = p.x;
                                newP.y = p.y;
                                newP.lastX = p.lastX;
                                newP.lastY = p.lastY;
                                newP.vx = randVel();
                                newP.vy = randVel();
                                nextSpawnTime = Date.now() + spawnRate;
                                currentParticleCount++;
                            } else {
                                spawnDirection = -1;
                            }
                        }

                        if (spawnDirection === -1 && i === currentParticleCount - 1) {
                            currentParticleCount--;
                            if (currentParticleCount === 0) {
                                InitIdleEffect();
                                return;
                            }
                            continue;
                        }
                    }

                    newVx = -newVx;

                    if (tryXf < 1.0) tryXf += 1.0;
                    else if (tryXf >= SCREEN_WIDTH - 1.0) tryXf -= 1.0;

                    tryXf += newVx * sinMultiplier;
                    xi_try = Math.floor(tryXf);
                }

                // Vertical collision
                if (yi_try < 0 || yi_try >= SCREEN_HEIGHT ||
                    Display.getPixel(p.lastX, yi_try) === 1) {
                    newVy = -newVy;

                    if (tryYf < 1.0) tryYf += 1.0;
                    else if (tryYf >= SCREEN_HEIGHT - 1.0) tryYf -= 1.0;

                    tryYf += newVy * cosMultiplier;
                    yi_try = Math.floor(tryYf);
                }

                let xi_final = xi_try;
                let yi_final = yi_try;

                // Final position check
                if (Display.getPixel(xi_final, yi_final) === 1) {
                    if (newVx > 0) newVx = -randPosVel();
                    else newVx = randPosVel();
                    if (newVy > 0) newVy = -randPosVel();
                    else newVy = randPosVel();

                    tryXf = p.x;
                    tryYf = p.y;
                    xi_final = p.lastX;
                    yi_final = p.lastY;
                }

                p.vx = newVx;
                p.vy = newVy;
                p.x = tryXf;
                p.y = tryYf;

                Display.writePixel(xi_final, yi_final, 1);
                p.lastX = xi_final;
                p.lastY = yi_final;
            }
        }
        function RenderIdleEffect_Rain() {
            for (let i = 0; i < currentParticleCount; i++) {
                const p = particles[i];

                // Erase previous pixel
                Display.writePixel(p.lastX, p.lastY, 0);

                // Apply gravity
                p.vy += GRAVITY;

                // Clamp velocities
                if (p.vx > MAX_VELOCITY) p.vx = MAX_VELOCITY;
                if (p.vx < -MAX_VELOCITY) p.vx = -MAX_VELOCITY;
                if (p.vy > MAX_VELOCITY) p.vy = MAX_VELOCITY;
                if (p.vy < -MAX_VELOCITY) p.vy = -MAX_VELOCITY;

                let tryXf = p.x + p.vx;
                let tryYf = p.y + p.vy;

                let xi_try = Math.floor(tryXf);
                let yi_try = Math.floor(tryYf);

                let newVx = p.vx;
                let newVy = p.vy;

                // Horizontal collision
                if (xi_try < 0 || xi_try >= SCREEN_WIDTH ||
                    Display.getPixel(xi_try, p.lastY) === 1) {

                    if (Date.now() > nextSpawnTime) {
                        if (spawnDirection === 1) {
                            if (currentParticleCount < IdleParticleCount) {
                                const newP = particles[currentParticleCount];
                                newP.x = p.x;
                                newP.y = 0; //p.y;  // VARIANT
                                newP.lastX = p.lastX;
                                newP.lastY = 0; //p.lastY;   // VARIANT
                                newP.vx = randVel();
                                newP.vy = randVel();
                                nextSpawnTime = Date.now() + spawnRate;
                                currentParticleCount++;
                            } else {
                                spawnDirection = -1;
                            }
                        }

                        if (spawnDirection === -1 && i === currentParticleCount - 1) {
                            currentParticleCount--;
                            if (currentParticleCount === 0) {
                                InitIdleEffect();
                                return;
                            }
                            continue;
                        }
                    }

                    newVx = -newVx;

                    if (tryXf < 1.0) tryXf += 1.0;
                    else if (tryXf >= SCREEN_WIDTH - 1.0) tryXf -= 1.0;

                    tryXf += newVx;
                    xi_try = Math.floor(tryXf);
                }

                // Vertical collision (with bottom wrap)
                if (yi_try < 0 || yi_try >= SCREEN_HEIGHT ||
                    Display.getPixel(p.lastX, yi_try) === 1) {

                    // Wrap at bottom
                    if (yi_try >= SCREEN_HEIGHT) {
                        let newX;
                        let attempts = 0;
                        do {
                            newX = Math.floor(rand() * SCREEN_WIDTH);
                            attempts++;
                        } while (Display.getPixel(newX, 0) === 1 && attempts < 100);

                        p.x = newX;
                        p.y = 0;
                        p.lastX = Math.floor(p.x);
                        p.lastY = 0;
                        p.vy = 0.1 + rand() * 0.2;
                        p.vx = randVel() * 0.5;

                        Display.writePixel(Math.floor(p.x), Math.floor(p.y), 1);
                        continue;
                    } else {
                        // Normal bounce (top or white pixel)
                        //newVy = -newVy;
                        newVy = -(newVy * 0.3) - 0.25;   // VARIANT
                        newVx = randVel() * 2;           // VARIANT excitable horizontal jumps

                        if (tryYf < 1.0) tryYf += 1.0;
                        else if (tryYf >= SCREEN_HEIGHT - 1.0) tryYf -= 1.0;

                        tryYf += newVy;
                        yi_try = Math.floor(tryYf);
                    }
                }

                let xi_final = xi_try;
                let yi_final = yi_try;

                // Final position check
                if (Display.getPixel(xi_final, yi_final) === 1) {
                    if (newVx > 0) newVx = -0.1 - rand() * 0.2;
                    else newVx = 0.1 + rand() * 0.2;
                    if (newVy > 0) newVy = -0.1 - rand() * 0.2;
                    else newVy = 0.1 + rand() * 0.2;

                    tryXf = p.x;
                    tryYf = p.y;
                    xi_final = p.lastX;
                    yi_final = p.lastY;
                }

                p.vx = newVx;
                p.vy = newVy;
                p.x = tryXf;
                p.y = tryYf;

                Display.writePixel(xi_final, yi_final, 1);
                p.lastX = xi_final;
                p.lastY = yi_final;
            }
        }

        // --- Initialization ---
        function InitIdleEffect() {
            // Reset swosh time
            swoshTimeV = 0;
            swoshTimeH = 0;

            // Just in case we want them
            rnd1 = (rand() * 4) + 1; // 1-5
            rnd2 = (rand() * 4) + 1; // 1-5

            // Draw random objects first
            Display.drawRandomObjects();

            // Initialize particles array
            particles = [];
            for (let i = 0; i < IDLE_MAX_PARTICLE_COUNT; i++) {
                particles.push(new IdleParticle());
            }

            const sp = IdleSpawnPoints[Math.floor(rand() * IdleSpawnPointCount)];
            const quarterCount = Math.floor(sp.maxParticles / 4);
            IdleParticleCount = quarterCount + Math.floor(rand() * (quarterCount * 3));

            // Initialize first particle
            let p = particles[0];

            // Find initial black pixel
            let attempts = 0;
            while (attempts < 1000) {
                p.x = sp.x + Math.floor(rand() * sp.w);
                p.y = sp.y + Math.floor(rand() * sp.h);
                if (Display.getPixel(Math.floor(p.x), Math.floor(p.y)) === 0) break;
                attempts++;
            }

            p.vx = randVel();
            p.vy = randVel();
            p.lastX = Math.floor(p.x);
            p.lastY = Math.floor(p.y);

            // Initialize remaining particles
            for (let i = 1; i < IdleParticleCount; i++) {
                p = particles[i];
                // Set them to the same position initially (will spawn from first particle)
                p.x = particles[0].x;
                p.y = particles[0].y;
                p.vx = randVel();
                p.vy = randVel();
                p.lastX = Math.floor(p.x);
                p.lastY = Math.floor(p.y);
            }

            currentParticleCount = 1;
            nextSpawnTime = Date.now() + spawnRate;
            spawnDirection = 1;

            document.getElementById('particleCount').textContent = IdleParticleCount;
        }

        // --- Main Loop ---
        let currentEffect = 'Bounce';

        function update() {
            // Call the selected effect
            if (currentEffect === 'Bounce') {
                RenderIdleEffect_Bounce();
            } else if (currentEffect === 'Gravity') {
                RenderIdleEffect_Gravity();
            } else if (currentEffect === 'GlobalSwoosh') {
                RenderIdleEffect_GlobalSwoosh();
            } else if (currentEffect === 'SprinkleSwoosh') {
                RenderIdleEffect_SprinkleSwoosh();
            } else if (currentEffect === 'GlobalSprinkleSwoosh') {
                RenderIdleEffect_GlobalSprinkleSwoosh();
            } else if (currentEffect === 'Rain') {
                RenderIdleEffect_Rain();
            }

            Display.render();
            requestAnimationFrame(update);
        }

        // --- Event Listeners ---
        document.getElementById('effectSelect').addEventListener('change', function (e) {
            currentEffect = e.target.value;
            // Reset the effect when switching
            InitIdleEffect();
        });

        // --- Start ---
        InitIdleEffect();
        update();
    </script>
</body>
