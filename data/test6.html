<!doctype html>
<meta charset="utf-8">
<title>squishy letter ring</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0e12; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #panel {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    background: rgba(20,20,26,0.92);
    color: #eee;
    font: 12px/1.4 system-ui, sans-serif;
    padding: 6px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
    user-select: none;
    border-bottom: 1px solid #333;
  }
  #panel .row { display: flex; align-items: center; gap: 6px; }
  #panel label { opacity: 0.75; white-space: nowrap; }
  #panel input[type="range"] { width: 110px; accent-color: #ff3366; }
  #panel .val {
    min-width: 42px; text-align: right;
    font-variant-numeric: tabular-nums; color: #ffcc00;
  }
  #panel .hint { opacity: 0.4; font-size: 11px; }
</style>
</head>
<body>

<div id="panel" aria-hidden="true"></div>

<canvas id="c"></canvas>

<script>
(() => {
'use strict';

/* ==================================================================
   SLIDER PANEL
   ================================================================== */
const SLIDERS = [
  { key: 'fontSizePct',                min: 0.02, max: 0.15,  step: 0.001 },
  { key: 'letterSpacingPct',           min: -0.2, max: 0.5,   step: 0.005 },
  { key: 'radiusPct',                  min: 0.10, max: 0.45,  step: 0.005 },
  { key: 'rollRadiusPct',              min: 0.02, max: 0.45,  step: 0.005 },
  { key: 'gravityPct',                 min: 0.0,  max: 0.002, step: 0.00002 },
  { key: 'startVxPct',                 min: -0.02, max: 0.02, step: 0.0005 },
  { key: 'startVyPct',                 min: -0.02, max: 0.02, step: 0.0005 },
  { key: 'spinDamp',                   min: 0.90, max: 1.0,   step: 0.001 },
  { key: 'minSpinSpeed',               min: -0.2, max: 0.2,   step: 0.002 },
  { key: 'bounceRandomness',           min: 0.0,  max: 0.6,   step: 0.01 },
  { key: 'restitution',                min: 0.5,  max: 1.0,   step: 0.01 },
  { key: 'edgeMargin',                 min: 0.2,  max: 1.0,   step: 0.01 },
  { key: 'glyphPad',                   min: 0.0,  max: 1.5,   step: 0.02 },
  { key: 'glyphEdgeOffsetPct',         min: -0.4, max: 0.6,   step: 0.01 },
  { key: 'ringStiff',                  min: 0.02, max: 0.5,   step: 0.01 },
  { key: 'ringDamp',                   min: 0.5,  max: 1.0,   step: 0.01 },

  // Gradient animation speeds
  { key: 'fillAnimSpeed',              min: -1,   max: 1,     step: 0.005 },
  { key: 'strokeAnimSpeed',            min: -1,   max: 1,     step: 0.005 },

  // Gradient shape
  { key: 'fillGradientHalfHeightPct',  min: 0.1,  max: 1.5,   step: 0.01 },
  { key: 'strokeGradientHalfHeightPct',min: 0.1,  max: 1.5,   step: 0.01 },

  // Stroke appearance
  { key: 'strokeWidthPct',             min: 0.0,  max: 0.4,   step: 0.002 },

  // Ring geometry
  { key: 'gapFraction',                min: 0.0,  max: 1.0,   step: 0.005 },

  // Edge behaviour
  { key: 'edgeContact',                min: 0.0,  max: 0.3,   step: 0.005 },
  { key: 'topOffsetPct',               min: 0.0,  max: 1.0,   step: 0.01 },
  { key: 'minBounceTopPct',            min: 0.0,  max: 1.0,   step: 0.01 },
  { key: 'minBounceBottomPct',         min: 0.0,  max: 1.0,   step: 0.01 },
  { key: 'minBounceSidesPct',          min: 0.0,  max: 1.0,   step: 0.01 },

  // Trails & zoom
  { key: 'trailClearAlpha',            min: 0.0,  max: 1.0,   step: 0.01 },
  { key: 'trailZoom',                  min: 0.3,  max: 2.0,   step: 0.001 },

  // Reflection
  { key: 'reflectionMarginPct',        min: 0.0,  max: 0.3,   step: 0.005 },
  { key: 'reflectionBrightness',       min: 0.0,  max: 1.0,   step: 0.02 },
  { key: 'reflectionSquish',           min: 0.1,  max: 1.0,   step: 0.02 },
];

const RECOMPUTE_KEYS = new Set([
  // Layout / physics constants recomputed in computeSizes():
  'fontSizePct', 'letterSpacingPct',
  'radiusPct', 'rollRadiusPct',
  'gravityPct', 'startVxPct', 'startVyPct',
  'glyphPad', 'glyphEdgeOffsetPct', 'edgeMargin',
  'reflectionMarginPct', 'reflectionSquish',
  'topOffsetPct',
  // Derived sizes also rebuilt by computeSizes():
  'strokeWidthPct',
  'fillGradientHalfHeightPct', 'strokeGradientHalfHeightPct',
  // Bounce speeds are re-derived from these on change:
  'minBounceTopPct', 'minBounceBottomPct', 'minBounceSidesPct',
]);

let pendingRecompute = false;
function scheduleRecompute() {
  if (pendingRecompute) return;
  pendingRecompute = true;
  requestAnimationFrame(() => {
    pendingRecompute = false;
    recomputeFromCFG();
  });
}

function decimalsFor(step) {
  if (step >= 1)     return 0;
  if (step >= 0.1)   return 1;
  if (step >= 0.01)  return 2;
  if (step >= 0.001) return 3;
  return 4;
}

function buildPanel() {
  const panel = document.getElementById('panel');

  for (const s of SLIDERS) {
    const row = document.createElement('div');
    row.className = 'row';

    const lab = document.createElement('label');
    lab.textContent = s.key;
    lab.htmlFor = 'sl_' + s.key;

    const input = document.createElement('input');
    input.type = 'range';
    input.id = 'sl_' + s.key;
    input.min  = String(s.min);
    input.max  = String(s.max);
    input.step = String(s.step);
    input.value = String(CFG[s.key]);

    const val = document.createElement('span');
    val.className = 'val';
    val.textContent = (+CFG[s.key]).toFixed(decimalsFor(s.step));

    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      CFG[s.key] = v;
      val.textContent = v.toFixed(decimalsFor(s.step));
      if (RECOMPUTE_KEYS.has(s.key)) scheduleRecompute();
    });

    row.appendChild(lab);
    row.appendChild(input);
    row.appendChild(val);
    panel.appendChild(row);
  }

  // Boolean toggle for trailZoomOnRing.
  {
    const row = document.createElement('div');
    row.className = 'row';

    const lab = document.createElement('label');
    lab.textContent = 'trailZoomOnRing';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!CFG.trailZoomOnRing;
    cb.addEventListener('change', () => {
      CFG.trailZoomOnRing = cb.checked;
    });

    row.appendChild(lab);
    row.appendChild(cb);
    panel.appendChild(row);
  }

  const hint = document.createElement('span');
  hint.className = 'hint';
  hint.textContent = 'drag to tune · click canvas to hide this panel';
  panel.appendChild(hint);
}

/* ==================================================================
   CONFIG
   ================================================================== */
const CFG = {
  // ─── Text ───────────────────────────────────────────────────────────
  text:        ' 🦀⭐🍓🥪🌊⛵🦀⭐🍓🥪🌊⛵ Badger packed his tiny bag, Stripy towel and sun‑hat swag, Waddled down the sandy track, Dreaming of a seaside snack. But on the shore he heard a “Yarr!”. Saw an eyepatch gleaming far - A pirate starfish struck a pose, Saltwater dripping off his toes. ⭐ Oh, the badger and the starfish on a sunny holiday, One wants treasure buried deep, the other loves to play. Digging through the golden sand, a perfect little team, If there’s a jam sandwich waiting, life is truly supreme. ⚓ Starfish waved his tiny arm, “Matey, help me! No alarm - I’ve got treasure, shiny bright, But I can’t dig - it’s quite a sight.” - Badger grinned, “Well that’s my thing, I’ll dig a hole fit for a king. But I’ll need payment for my toil… How ‘bout a jam sandwich for the spoil?” 🥪 Oh, the badger and the starfish on a sunny holiday, One wants treasure buried deep, the other loves to play. Digging through the golden sand, a perfect little team, If there’s a jam sandwich waiting, life is truly supreme. 🍓 So they dug and dug until the sun, Turned the waves to liquid gold. Starfish placed his chest inside, Secrets safe and stories told. Badger munched his sandwich sweet, Jam dripping on his sandy feet - Two new friends upon the shore, Pirate tales forevermore. 🏴‍☠️ Yeah, the badger and the starfish on a sunny holiday, Treasure buried, sandwich eaten, perfect seaside day. If you stroll along that beach, you might just hear them sing - A pirate’s laugh, a badger’s cheer, in harmony they ring.',

  fontWeight:  700,
  fontFamily:  'system-ui, -apple-system, "Segoe UI", sans-serif',

  // ─── Fill appearance ────────────────────────────────────────────────
  fillColor: '#f2f2f5',
  fillStops: [
    { pos: 0.20, color: '#222222' },
    { pos: 0.35, color: '#777799' },
    { pos: 0.50, color: '#ffffff' },
    { pos: 0.501, color: '#e09000' },
    { pos: 0.75, color: '#000000' },
    { pos: 0.80, color: '#222222' },
  ],
  fillAnimSpeed: 0,
  fillGradientHalfHeightPct: 0.55,

  // ─── Stroke / outline ───────────────────────────────────────────────
  strokeEnabled:  true,
  strokeWidthPct: 0.06,
  strokeLineJoin: 'round',
  strokeLineCap:  'round',
  strokeColor: '#000000',
  strokeStops: [
    { pos: 0.0, color: '#ffffff' },
    { pos: 0.50, color: '#000000' },
    { pos: 1.0, color: '#ffffff' },
  ],
  strokeAnimSpeed: 0,
  strokeGradientHalfHeightPct: 0.55,

  // ─── Sizes (fractions of unit = min(W, H)) ──────────────────────────
  fontSizePct:      0.069,
  letterSpacingPct: 0.00,
  radiusPct:        0.25,
  rollRadiusPct:    0.25,

  // ─── Speeds (fractions of unit per step) ────────────────────────────
  startVxPct:  -0.003,
  startVyPct:  -0.007,
  gravityPct:   0.00048,

  // ─── Angular ────────────────────────────────────────────────────────
  initialOmega:  0,
  minSpinSpeed: -0.05,
  spinDamp:      0.975,

  // ─── Ring geometry ──────────────────────────────────────────────────
  gapFraction: 0.05,
  ringOffset:  Math.PI / 2,

  // ─── Edge behaviour ─────────────────────────────────────────────────
  edgeContact: 0.075,

  // Fraction of screen height by which the top edge is shifted UP off-screen.
  //   0.0 → the ring bounces off the actual top of the screen (default)
  //   1.0 → the top wall sits one full screen height above the visible top,
  //         so the ring can fly off-screen upward and come back
  //   Anything in between gives a corresponding offset.
  // Only affects the top wall; the floor/side walls are unchanged.
  topOffsetPct: 0.0,

  minBounceTopPct:     0.00,
  minBounceBottomPct:  0.50,
  minBounceSidesPct:   0.01,
  edgeMargin:  0.80,
  restitution: 1.0,
  bounceRandomness: 0.10,

  // ─── Glyph edge padding ─────────────────────────────────────────────
  glyphPad: 0.62,
  glyphEdgeOffsetPct: -0.12,

  // ─── Reflected floor ────────────────────────────────────────────────
  reflectionMarginPct: 0.05,
  reflectionBrightness: 0.15,
  reflectionSquish: 0.50,

  // ─── Screen trails ──────────────────────────────────────────────────
  trailClearAlpha: 1.0,
  trailClearColor: '#0e0e12',
  trailBgColor:    '#0e0e12',
  trailZoom: 1.0,
  trailZoomOnRing: false,

  // ─── Emoji rendering ────────────────────────────────────────────────
  cacheEmoji: true,

  // ─── Soft-body ring ─────────────────────────────────────────────────
  ringPoints:  360,
  ringIters:   1,
  ringStiff:   0.18,
  ringDamp:    0.88,
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0;
let DPR = 1;

let radius = 0, rollRadius = 0, fontSize = 0, letterSpacing = 0;
let startVx = 0, startVy = 0, gravity = 0;
let pad = 0, bodyLim = 0, contactR = 0;
let minSpeedTop = 0, minSpeedBottom = 0, minSpeedSides = 0;
let strokeWidth = 0, fillGradHalfH = 0, strokeGradHalfH = 0;

let floorY = 0;
let marginPx = 0;
let topY = 0;

const N = CFG.ringPoints;
let restX, restY, segLen;
const ring = [];

/* scratch canvas for zoom-copy and reflection ------------------- */
const scratch = document.createElement('canvas');
const sctx    = scratch.getContext('2d');
function resizeScratch() {
  scratch.width  = canvas.width;
  scratch.height = canvas.height;
}

/* emoji cache --------------------------------------------------- */
const emojiCache = new Map();
const EMOJI_RE = /\p{Extended_Pictographic}/u;
function isEmoji(ch) { return EMOJI_RE.test(ch); }
function clearEmojiCache() { emojiCache.clear(); }

function getEmojiBitmap(ch) {
  let entry = emojiCache.get(ch);
  if (entry) return entry;

  ctx.font = `${CFG.fontWeight} ${fontSize}px ${CFG.fontFamily}`;
  const m   = ctx.measureText(ch);
  const p   = Math.ceil(fontSize * 0.35);
  const w   = Math.ceil(m.width) + p * 2;
  const h   = Math.ceil(fontSize * 1.6);

  const c  = document.createElement('canvas');
  c.width  = w;
  c.height = h;
  const cc = c.getContext('2d');
  cc.font         = `${CFG.fontWeight} ${fontSize}px ${CFG.fontFamily}`;
  cc.textAlign    = 'center';
  cc.textBaseline = 'middle';
  cc.fillText(ch, w / 2, h / 2);

  entry = { canvas: c, w, h };
  emojiCache.set(ch, entry);
  return entry;
}

/* sizing -------------------------------------------------------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  resizeScratch();
}

function computeSizes() {
  const u = Math.min(W, H);

  radius        = u * CFG.radiusPct;
  rollRadius    = u * CFG.rollRadiusPct;
  fontSize      = u * CFG.fontSizePct;
  letterSpacing = fontSize * CFG.letterSpacingPct;

  startVx = u * CFG.startVxPct;
  startVy = u * CFG.startVyPct;
  gravity = u * CFG.gravityPct;

  pad             = fontSize * (CFG.glyphPad + CFG.glyphEdgeOffsetPct);
  bodyLim         = radius * CFG.edgeMargin;
  contactR        = Math.max(1, bodyLim - pad);
  strokeWidth     = fontSize * CFG.strokeWidthPct;
  fillGradHalfH   = fontSize * CFG.fillGradientHalfHeightPct;
  strokeGradHalfH = fontSize * CFG.strokeGradientHalfHeightPct;

  marginPx = H * CFG.reflectionMarginPct;
  floorY   = H - marginPx;
  topY     = -H * CFG.topOffsetPct;

  const playAreaH = floorY - topY;

  minSpeedTop    = Math.sqrt(2 * gravity * playAreaH * CFG.minBounceTopPct);
  minSpeedBottom = Math.sqrt(2 * gravity * playAreaH * CFG.minBounceBottomPct);
  minSpeedSides  = Math.sqrt(2 * gravity * W * CFG.minBounceSidesPct);

  restX = new Float64Array(N);
  restY = new Float64Array(N);
  for (let k = 0; k < N; k++) {
    const a = CFG.ringOffset + (k / N) * Math.PI * 2;
    restX[k] = Math.cos(a) * radius;
    restY[k] = Math.sin(a) * radius;
  }
  segLen = (2 * Math.PI * radius) / N;

  clearEmojiCache();
}

function recomputeFromCFG() {
  computeSizes();
  layoutText();
  clampBody();
  initRing();
}

/* letter layout -------------------------------------------------- */
let chars = [], advances = [], prefixes = [], textLen = 0;

function layoutText() {
  ctx.font = `${CFG.fontWeight} ${fontSize}px ${CFG.fontFamily}`;
  chars = Array.from(CFG.text);
  advances = []; prefixes = []; textLen = 0;
  let cursor = 0;
  for (const ch of chars) {
    prefixes.push(cursor);
    const w = ctx.measureText(ch).width;
    advances.push(w);
    cursor += w + letterSpacing;
  }
  textLen = cursor;
}

/* helpers -------------------------------------------------------- */
function bounceMul() {
  return 1 - Math.random() * CFG.bounceRandomness;
}
function parseColor(c) {
  if (typeof c !== 'string') return [255, 255, 255];
  c = c.trim();
  if (c[0] === '#') {
    if (c.length === 4) {
      return [parseInt(c[1]+c[1],16), parseInt(c[2]+c[2],16), parseInt(c[3]+c[3],16)];
    }
    if (c.length === 7) {
      return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
    }
  }
  return [255, 255, 255];
}
function lerpColor(a, b, t) {
  const A = parseColor(a), B = parseColor(b);
  const r = Math.round(A[0] + (B[0]-A[0])*t);
  const g = Math.round(A[1] + (B[1]-A[1])*t);
  const bl = Math.round(A[2] + (B[2]-A[2])*t);
  return `rgb(${r},${g},${bl})`;
}
function colorAtCyclic(stops, u) {
  const n = stops.length;
  if (n === 0) return '#ffffff';
  if (n === 1) return stops[0].color;
  if (u <= stops[0].pos) return stops[0].color;
  if (u >= stops[n-1].pos) return stops[n-1].color;
  for (let i = 0; i < n - 1; i++) {
    if (u >= stops[i].pos && u <= stops[i+1].pos) {
      const range = stops[i+1].pos - stops[i].pos;
      const f = range > 1e-9 ? (u - stops[i].pos) / range : 0;
      return lerpColor(stops[i].color, stops[i+1].color, f);
    }
  }
  return stops[n-1].color;
}
function buildGradient(ctx, y0, y1, stops, t) {
  const grad = ctx.createLinearGradient(0, y0, 0, y1);
  const n = stops.length;
  if (n < 2 || t === 0) {
    for (const s of stops) grad.addColorStop(s.pos, s.color);
    return grad;
  }
  t = ((t % 1) + 1) % 1;
  const pts = [];
  for (let k = -1; k <= 1; k++) {
    for (let i = 0; i < n; i++) {
      const p = stops[i].pos + k + t;
      if (p >= 0 && p <= 1) pts.push({ pos: p, color: stops[i].color });
    }
  }
  pts.sort((a, b) => a.pos - b.pos);
  const merged = [];
  for (const p of pts) {
    if (merged.length > 0 && Math.abs(merged[merged.length-1].pos - p.pos) < 1e-6) {
      merged[merged.length-1] = p;
    } else {
      merged.push(p);
    }
  }
  const uEnd = ((1 - t) % 1 + 1) % 1;
  const endColor = colorAtCyclic(stops, uEnd);
  if (merged.length === 0 || merged[0].pos > 1e-6) merged.unshift({ pos: 0, color: endColor });
  if (merged[merged.length-1].pos < 1 - 1e-6) merged.push({ pos: 1, color: endColor });
  for (const m of merged) grad.addColorStop(m.pos, m.color);
  return grad;
}

/* body ----------------------------------------------------------- */
const body = { x: 0, y: 0, vx: 0, vy: 0, spin: 0, omega: 0 };

function resetBody() {
  body.x = W * 0.5;
  body.y = (topY + floorY) * 0.5;
  body.vx = startVx;
  body.vy = startVy;
  body.spin = 0;
  body.omega = CFG.initialOmega;
}
function clampBody() {
  const m = radius * CFG.edgeMargin;
  body.x = Math.min(Math.max(body.x, m), Math.max(m, W - m));
  const lo = topY + m;
  const hi = floorY - m;
  body.y = Math.min(Math.max(body.y, lo), Math.max(lo, hi));
}

function stepBody() {
  const R  = radius;
  const m  = bodyLim;
  const loX = m, hiX = W - m, loY = topY + m, hiY = floorY - m;

  const eps = 1.0;
  let onLeft = false, onRight = false, onTop = false, onBot = false;
  for (let k = 0; k < N; k++) {
    const p = ring[k];
    if (p.x <= pad + eps)          onLeft  = true;
    if (p.x >= W - pad - eps)      onRight = true;
    if (p.y <= topY + pad + eps)   onTop   = true;
    if (p.y >= floorY - pad - eps) onBot   = true;
    if (onLeft && onRight && onTop && onBot) break;
  }
  const onWall = onLeft || onRight || onTop || onBot;

  body.vy += gravity;
  body.x  += body.vx;
  body.y  += body.vy;

  if (body.x < loX) {
    body.x = loX;
    let v = Math.abs(body.vx) * CFG.restitution;
    if (v < minSpeedSides) v = minSpeedSides;
    v *= bounceMul();
    body.vx = v;
  } else if (body.x > hiX) {
    body.x = hiX;
    let v = Math.abs(body.vx) * CFG.restitution;
    if (v < minSpeedSides) v = minSpeedSides;
    v *= bounceMul();
    body.vx = -v;
  }

  if (body.y < loY) {
    body.y = loY;
    let v = Math.abs(body.vy) * CFG.restitution;
    if (v < minSpeedTop) v = minSpeedTop;
    v *= bounceMul();
    body.vy = v;
  }
  if (body.y > hiY) {
    body.y = hiY;
    let v = Math.abs(body.vy) * CFG.restitution;
    if (v < minSpeedBottom) v = minSpeedBottom;
    v *= bounceMul();
    body.vy = -v;
  }

  if (onWall) {
    const lr = rollRadius;
    let sum = 0, count = 0;
    if (onLeft)  { sum +=  body.vy / lr; count++; }
    if (onRight) { sum += -body.vy / lr; count++; }
    if (onTop)   { sum += -body.vx / lr; count++; }
    if (onBot)   { sum +=  body.vx / lr; count++; }
    body.omega = sum / count;
  } else {
    body.omega = CFG.minSpinSpeed + (body.omega - CFG.minSpinSpeed) * CFG.spinDamp;
  }

  body.spin += body.omega;
  if (textLen > 0) {
    const wrap = textLen / R;
    body.spin = ((body.spin % wrap) + wrap) % wrap;
  }
}

/* soft ring ------------------------------------------------------ */
function initRing() {
  ring.length = 0;
  for (let k = 0; k < N; k++) {
    const x = body.x + restX[k], y = body.y + restY[k];
    ring.push({ x, y, px: x, py: y });
  }
}

function stepRing() {
  const minX = pad, maxX = W - pad;
  const minY = topY + pad, maxY = floorY - pad;

  for (let k = 0; k < N; k++) {
    const p  = ring[k];
    const ix = body.x + restX[k];
    const iy = body.y + restY[k];

    const vx = (p.x - p.px) * CFG.ringDamp;
    const vy = (p.y - p.py) * CFG.ringDamp;

    p.px = p.x; p.py = p.y;
    p.x += vx + (ix - p.x) * CFG.ringStiff;
    p.y += vy + (iy - p.y) * CFG.ringStiff;
  }

  for (let it = 0; it < CFG.ringIters; it++) {
    for (let k = 0; k < N; k++) {
      const a = ring[k], b = ring[(k + 1) % N];
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1e-9;
      const f = ((d - segLen) / d) * 0.5;
      dx *= f; dy *= f;
      a.x += dx; a.y += dy;
      b.x -= dx; b.y -= dy;
    }
    for (let k = 0; k < N; k++) {
      const p = ring[k];
      if (p.x < minX) p.x = minX; else if (p.x > maxX) p.x = maxX;
      if (p.y < minY) p.y = minY; else if (p.y > maxY) p.y = maxY;
    }
  }
}

/* arc-length lookup --------------------------------------------- */
const cum = new Float64Array(N + 1);
let totalCurveLen = 0;

function buildCurve() {
  cum[0] = 0;
  for (let k = 0; k < N; k++) {
    const a = ring[k], b = ring[(k + 1) % N];
    cum[k + 1] = cum[k] + Math.hypot(b.x - a.x, b.y - a.y);
  }
  totalCurveLen = cum[N];
}

const S = { x: 0, y: 0, tx: 1, ty: 0 };
function sampleAt(t) {
  t -= Math.floor(t);
  const target = t * totalCurveLen;

  let lo = 0, hi = N;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (cum[mid] <= target) lo = mid + 1; else hi = mid;
  }
  const k = Math.min(N - 1, Math.max(0, lo - 1));
  const a = ring[k], b = ring[(k + 1) % N];
  const seg = cum[k + 1] - cum[k] || 1e-9;
  const u = Math.min(1, Math.max(0, (target - cum[k]) / seg));

  S.x = a.x + (b.x - a.x) * u;
  S.y = a.y + (b.y - a.y) * u;

  const dx = b.x - a.x, dy = b.y - a.y;
  const l = Math.hypot(dx, dy) || 1e-9;
  S.tx = dx / l; S.ty = dy / l;
  return S;
}

/* glyph pass ----------------------------------------------------- */
let fillAnimTime = 0;
let strokeAnimTime = 0;

function drawGlyphs(alphaMul) {
  if (textLen <= 0) return;

  const C       = 2 * Math.PI * radius;
  const span    = C * (1 - CFG.gapFraction);
  const wStart  = C * CFG.gapFraction * 0.5;
  const fadeArc = Math.min(fontSize * 2.5, span * 0.2);

  const scroll = body.spin * radius;

  const useFillGrad   = CFG.fillStops   && CFG.fillStops.length   > 1;
  const useStrokeGrad = CFG.strokeStops && CFG.strokeStops.length > 1;

  for (let i = 0; i < chars.length; i++) {
    const ch    = chars[i];
    const half  = advances[i] * 0.5;
    const base  = prefixes[i] + half + scroll;
    const emoji = CFG.cacheEmoji && isEmoji(ch);

    const kMin = Math.ceil(-base / textLen);
    const kMax = Math.floor((span - base) / textLen);

    for (let k = kMin; k <= kMax; k++) {
      const d = base + k * textLen;
      if (d < 0 || d > span) continue;

      const edge  = Math.min(d, span - d);
      const alpha = fadeArc > 0 ? Math.min(1, edge / fadeArc) : 1;
      if (alpha <= 0.02) continue;

      const p   = sampleAt((wStart + d) / C);
      const ang = Math.atan2(p.ty, p.tx);

      ctx.save();
      ctx.globalAlpha = alpha * alphaMul;
      ctx.translate(p.x, p.y);
      ctx.rotate(ang);

      if (emoji) {
        const bmp = getEmojiBitmap(ch);
        ctx.drawImage(bmp.canvas, -bmp.w * 0.5, -bmp.h * 0.5);
      } else {
        if (CFG.strokeEnabled && strokeWidth > 0) {
          ctx.lineWidth = strokeWidth;
          ctx.lineJoin  = CFG.strokeLineJoin;
          ctx.lineCap   = CFG.strokeLineCap;
          let strokeStyle;
          if (useStrokeGrad) {
            strokeStyle = buildGradient(ctx, -strokeGradHalfH, strokeGradHalfH,
                                        CFG.strokeStops, strokeAnimTime);
          } else if (CFG.strokeStops && CFG.strokeStops.length === 1) {
            strokeStyle = CFG.strokeStops[0].color;
          } else {
            strokeStyle = CFG.strokeColor;
          }
          ctx.strokeStyle = strokeStyle;
          ctx.strokeText(ch, 0, 0);
        }

        let fillStyle;
        if (useFillGrad) {
          fillStyle = buildGradient(ctx, -fillGradHalfH, fillGradHalfH,
                                    CFG.fillStops, fillAnimTime);
        } else if (CFG.fillStops && CFG.fillStops.length === 1) {
          fillStyle = CFG.fillStops[0].color;
        } else {
          fillStyle = CFG.fillColor;
        }
        ctx.fillStyle = fillStyle;
        ctx.fillText(ch, 0, 0);
      }

      ctx.restore();
    }
  }
}

/* render --------------------------------------------------------- */
function render() {
  ctx.globalAlpha = 1;

  const playH   = floorY;
  const playHpx = Math.round(playH * DPR);

  if (CFG.trailZoom !== 1.0) {
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.clearRect(0, 0, scratch.width, scratch.height);
    sctx.drawImage(canvas, 0, 0);

    const pivotX = CFG.trailZoomOnRing ? body.x * DPR : (W / 2) * DPR;
    const pivotY = CFG.trailZoomOnRing ? body.y * DPR : (H / 2) * DPR;

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    ctx.beginPath();
    ctx.rect(0, 0, scratch.width, playHpx);
    ctx.clip();

    ctx.globalAlpha = 1;
    ctx.fillStyle = CFG.trailClearColor;
    ctx.fillRect(0, 0, scratch.width, playHpx);

    ctx.globalAlpha = CFG.trailClearAlpha;
    ctx.translate(pivotX, pivotY);
    ctx.scale(CFG.trailZoom, CFG.trailZoom);
    ctx.translate(-pivotX, -pivotY);

    ctx.drawImage(
      scratch,
      0, 0, scratch.width, playHpx,
      0, 0, scratch.width, playHpx
    );

    ctx.restore();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  } else {
    if (CFG.trailClearAlpha < 1) {
      ctx.globalAlpha = CFG.trailClearAlpha;
      ctx.fillStyle = CFG.trailClearColor;
      ctx.fillRect(0, 0, W, playH);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = 1;
      ctx.fillStyle = CFG.trailBgColor;
      ctx.fillRect(0, 0, W, playH);
    }
  }

  ctx.font = `${CFG.fontWeight} ${fontSize}px ${CFG.fontFamily}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  drawGlyphs(1.0);

  if (marginPx > 0.5 && CFG.reflectionBrightness > 0) {
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.fillStyle = CFG.trailBgColor;
    ctx.fillRect(0, floorY, W, marginPx);
    ctx.restore();

    const squish = Math.max(0.01, CFG.reflectionSquish);
    const srcH   = marginPx / squish;
    const srcY   = floorY - srcH;

    if (srcY > -marginPx) {
      sctx.setTransform(1, 0, 0, 1, 0, 0);
      sctx.clearRect(0, 0, scratch.width, scratch.height);
      sctx.drawImage(canvas, 0, 0);

      ctx.save();

      ctx.beginPath();
      ctx.rect(0, floorY, W, marginPx);
      ctx.clip();

      const syDev = Math.max(0, srcY * DPR);
      const shDev = Math.min(
        scratch.height - syDev,
        (floorY - Math.max(0, srcY)) * DPR
      );

      if (shDev > 0) {
        ctx.globalAlpha = CFG.reflectionBrightness;

        ctx.translate(0, floorY);
        ctx.scale(1, -squish);
        ctx.translate(0, -floorY);

        ctx.drawImage(
          scratch,
          0, syDev, scratch.width, shDev,
          0, srcY, W, srcH
        );
      }

      ctx.restore();
    }
  }
}

/* loop ----------------------------------------------------------- */
const STEP = 1 / 60;
let acc = 0, last = 0;

function frame(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;

  while (acc >= STEP) {
    stepBody();
    stepRing();
    acc -= STEP;
  }

  if (CFG.fillAnimSpeed) {
    fillAnimTime += dt * CFG.fillAnimSpeed;
    fillAnimTime = ((fillAnimTime % 1) + 1) % 1;
  }
  if (CFG.strokeAnimSpeed) {
    strokeAnimTime += dt * CFG.strokeAnimSpeed;
    strokeAnimTime = ((strokeAnimTime % 1) + 1) % 1;
  }

  buildCurve();
  render();
  requestAnimationFrame(frame);
}

/* boot ----------------------------------------------------------- */
let prevUnit = 0;

function onResize() {
  const oldUnit = prevUnit;
  const oldW = W, oldH = H;

  resize();
  computeSizes();

  const newUnit = Math.min(W, H);
  if (oldUnit > 0 && oldW > 0 && oldH > 0) {
    const ru = newUnit / oldUnit;
    body.x *= W / oldW;
    body.y *= H / oldH;
    body.vx *= ru;
    body.vy *= ru;
  }
  prevUnit = newUnit;

  layoutText();
  clampBody();
  initRing();
}
window.addEventListener('resize', onResize);

function normaliseStops(stops) {
  if (!stops || !stops.length) return stops;
  return stops
    .map(s => ({ pos: Math.max(0, Math.min(1, s.pos)), color: s.color }))
    .sort((a, b) => a.pos - b.pos);
}

function init() {
  CFG.fillStops   = normaliseStops(CFG.fillStops);
  CFG.strokeStops = normaliseStops(CFG.strokeStops);

  resize();
  computeSizes();
  prevUnit = Math.min(W, H);
  layoutText();
  resetBody();
  initRing();

  buildPanel();

  canvas.addEventListener('click', () => {
    const p = document.getElementById('panel');
    p.style.display = (p.style.display === 'none') ? '' : 'none';
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') {
      const p = document.getElementById('panel');
      p.style.display = (p.style.display === 'none') ? '' : 'none';
    }
  });

  requestAnimationFrame(frame);
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(init);
} else {
  init();
}
})();
</script>
</body>
