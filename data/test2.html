<!doctype html>
<meta charset="utf-8">
<title>squishy letter ring</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0e12; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

const CFG = {
  text:        'SQUISHY LETTER RING • ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',
  radius:     150,      // px — ring radius the glyph centres ride on
  fontSize:    32,
  fontWeight:  700,
  fontFamily:  'system-ui, -apple-system, "Segoe UI", sans-serif',
  color:       '#f2f2f5',

  scrollSpeed: -5.25,     // px per 1/60 s step — exact, sub-pixel
  gapFraction: 0.05,     // share of the ring left empty (the start/end point)

  ringOffset:  Math.PI / 2,   // where parameter 0 sits: 0=top, PI/2=bottom

  letterSpacing: 5,      // extra px between glyphs (can be negative)
  startVx:       7.0,    // initial horizontal velocity (px per 1/60 s step)
  startVy:      -7.0,    // initial vertical velocity   (px per 1/60 s step)

  edgeMargin:  0.25,     // centre may approach an edge to within 25% of R
  restitution: 1.0,
  // startSpeed: 10.0,   // kept only as a fallback (see resetBody below)

  ringPoints:  260,      // much denser chain
  ringIters:   1,
  ringStiff:   0.18,     // pull back toward the undeformed ring
  ringDamp:    0.88,
  glyphPad:    0.62,     // glyph half-extent, as a fraction of fontSize
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0;

/* ------------------------------------------------------------------ */
/* canvas sizing (device-pixel-ratio aware)                            */
/* ------------------------------------------------------------------ */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // now we draw in CSS px
}
window.addEventListener('resize', () => { resize(); clampBody(); });

/* ------------------------------------------------------------------ */
/* text layout — measured ONCE, after fonts are ready                  */
/* ------------------------------------------------------------------ */
let chars = [], advances = [], prefixes = [], textLen = 0;

function layoutText() {
  ctx.font = `${CFG.fontWeight} ${CFG.fontSize}px ${CFG.fontFamily}`;
  chars = Array.from(CFG.text);
  advances = []; prefixes = []; textLen = 0;

  let cursor = 0;
  for (const ch of chars) {
    prefixes.push(cursor);                 // left edge of this glyph's cell
    const w = ctx.measureText(ch).width;
    advances.push(w);                      // natural glyph width
    cursor += w + CFG.letterSpacing;       // extra gap between cells
  }
  textLen = cursor;
}

/* ------------------------------------------------------------------ */
/* the bouncing body                                                   */
/* ------------------------------------------------------------------ */
const body = { x: 0, y: 0, vx: 0, vy: 0 };

function resetBody() {
  body.x = W * 0.5;
  body.y = H * 0.5;

  if (CFG.startVx !== undefined || CFG.startVy !== undefined) {
    body.vx = CFG.startVx ?? 0;
    body.vy = CFG.startVy ?? 0;
  } else {
    // fallback: random direction at startSpeed
    const a = Math.random() * Math.PI * 2;
    body.vx = Math.cos(a) * (CFG.startSpeed ?? 3);
    body.vy = Math.sin(a) * (CFG.startSpeed ?? 3);
  }
}

function clampBody() {
  const m = CFG.radius * CFG.edgeMargin;
  body.x = Math.min(Math.max(body.x, m), Math.max(m, W - m));
  body.y = Math.min(Math.max(body.y, m), Math.max(m, H - m));
}

function stepBody() {
  body.x += body.vx;
  body.y += body.vy;

  const m = CFG.radius * CFG.edgeMargin;
  const loX = m, hiX = W - m, loY = m, hiY = H - m;

  if (body.x < loX)      { body.x = loX; body.vx =  Math.abs(body.vx) * CFG.restitution; }
  else if (body.x > hiX) { body.x = hiX; body.vx = -Math.abs(body.vx) * CFG.restitution; }
  if (body.y < loY)      { body.y = loY; body.vy =  Math.abs(body.vy) * CFG.restitution; }
  else if (body.y > hiY) { body.y = hiY; body.vy = -Math.abs(body.vy) * CFG.restitution; }
}

/* ------------------------------------------------------------------ */
/* the soft ring — verlet points + position-based-dynamics relaxation  */
/* ------------------------------------------------------------------ */
const N = CFG.ringPoints;
const restX = new Float64Array(N), restY = new Float64Array(N);
for (let k = 0; k < N; k++) {
  // parameter 0 sits at CFG.ringOffset; increasing k runs clockwise on screen
  const a = CFG.ringOffset + (k / N) * Math.PI * 2;
  restX[k] = Math.cos(a) * CFG.radius;
  restY[k] = Math.sin(a) * CFG.radius;
}
const segLen = (2 * Math.PI * CFG.radius) / N;

const ring = [];
function initRing() {
  ring.length = 0;
  for (let k = 0; k < N; k++) {
    const x = body.x + restX[k], y = body.y + restY[k];
    ring.push({ x, y, px: x, py: y });
  }
}

function stepRing() {
  const pad  = CFG.fontSize * CFG.glyphPad;
  const minX = pad, maxX = W - pad, minY = pad, maxY = H - pad;

  // 1. integrate: inertia + spring toward the ideal undeformed ring
  for (let k = 0; k < N; k++) {
    const p  = ring[k];
    const ix = body.x + restX[k];
    const iy = body.y + restY[k];

    const vx = (p.x - p.px) * CFG.ringDamp;
    const vy = (p.y - p.py) * CFG.ringDamp;

    p.px = p.x; p.py = p.y;
    p.x += vx + (ix - p.x) * CFG.ringStiff;
    p.y += vy + (iy - p.y) * CFG.ringStiff;
  }

  // 2. relax
  for (let it = 0; it < CFG.ringIters; it++) {
    // keep neighbours at rest spacing -> perimeter is conserved
    for (let k = 0; k < N; k++) {
      const a = ring[k], b = ring[(k + 1) % N];
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1e-9;
      const f = ((d - segLen) / d) * 0.5;
      dx *= f; dy *= f;
      a.x += dx; a.y += dy;
      b.x -= dx; b.y -= dy;
    }
    // nothing may cross the screen edge
    for (let k = 0; k < N; k++) {
      const p = ring[k];
      if (p.x < minX) p.x = minX; else if (p.x > maxX) p.x = maxX;
      if (p.y < minY) p.y = minY; else if (p.y > maxY) p.y = maxY;
    }
  }
}

/* ------------------------------------------------------------------ */
/* arc-length lookup along the deformed ring                           */
/* ------------------------------------------------------------------ */
const cum = new Float64Array(N + 1);
let totalCurveLen = 0;

function buildCurve() {
  cum[0] = 0;
  for (let k = 0; k < N; k++) {
    const a = ring[k], b = ring[(k + 1) % N];
    cum[k + 1] = cum[k] + Math.hypot(b.x - a.x, b.y - a.y);
  }
  totalCurveLen = cum[N];
}

const S = { x: 0, y: 0, tx: 1, ty: 0 };

function sampleAt(t) {
  t -= Math.floor(t);
  const target = t * totalCurveLen;

  let lo = 0, hi = N;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (cum[mid] <= target) lo = mid + 1; else hi = mid;
  }
  const k = Math.min(N - 1, Math.max(0, lo - 1));
  const a = ring[k], b = ring[(k + 1) % N];
  const seg = cum[k + 1] - cum[k] || 1e-9;
  const u = Math.min(1, Math.max(0, (target - cum[k]) / seg));

  S.x = a.x + (b.x - a.x) * u;
  S.y = a.y + (b.y - a.y) * u;

  const dx = b.x - a.x, dy = b.y - a.y;
  const l = Math.hypot(dx, dy) || 1e-9;
  S.tx = dx / l; S.ty = dy / l;
  return S;
}

/* ------------------------------------------------------------------ */
/* render                                                              */
/* ------------------------------------------------------------------ */
let scroll = 0;   // px along the (infinitely repeating) text strip

function render() {
  ctx.fillStyle = '#0e0e12';
  ctx.fillRect(0, 0, W, H);

  ctx.font = `${CFG.fontWeight} ${CFG.fontSize}px ${CFG.fontFamily}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = CFG.color;

  if (textLen <= 0) return;

  const C     = 2 * Math.PI * CFG.radius;         // ring circumference (ideal)
  const span  = C * (1 - CFG.gapFraction);        // arc the text window occupies
  const wStart = C * CFG.gapFraction * 0.5;       // where the window starts
  const fadeArc = Math.min(CFG.fontSize * 2.5, span * 0.2);

  // Walk the text strip.  Because the strip is periodic with period textLen,
  // a character at strip offset `s` shows up at window offset
  //     d = s + scroll + k*textLen   (k an integer)
  // and is visible only while 0 <= d <= span.
  for (let i = 0; i < chars.length; i++) {
    const half = advances[i] * 0.5;               // glyph centre within its cell
    const base = prefixes[i] + half + scroll;

    const kMin = Math.ceil(-base / textLen);
    const kMax = Math.floor((span - base) / textLen);

    for (let k = kMin; k <= kMax; k++) {
      const d = base + k * textLen;
      if (d < 0 || d > span) continue;

      // soft ends: fade in at the start of the run, out at the end
      const edge  = Math.min(d, span - d);
      const alpha = fadeArc > 0 ? Math.min(1, edge / fadeArc) : 1;
      if (alpha <= 0.02) continue;

      const p   = sampleAt((wStart + d) / C);
      const ang = Math.atan2(p.ty, p.tx);         // glyph "up" points outward

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(ang);
      ctx.fillText(chars[i], 0, 0);
      ctx.restore();
    }
  }
}

/* ------------------------------------------------------------------ */
/* fixed-timestep loop                                                 */
/* ------------------------------------------------------------------ */
const STEP = 1 / 60;
let acc = 0, last = 0;

function frame(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;          // tab-switch guard
  acc += dt;

  while (acc >= STEP) {
    if (textLen > 0) {
      scroll += CFG.scrollSpeed;                 // exact px per 1/60 s
      if (scroll >= textLen) scroll -= textLen;  // seamless — strip repeats
    }
    stepBody();
    stepRing();
    acc -= STEP;
  }

  buildCurve();
  render();
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ */
/* boot                                                                */
/* ------------------------------------------------------------------ */
function init() {
  resize();
  layoutText();      // must happen after the font is actually available
  resetBody();
  initRing();
  scroll = 0;
  requestAnimationFrame(frame);
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(init);
} else {
  init();
}
})();
</script>
